<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vox Documentary V3 // 8-Photo Stack & Satellite Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@600;800;900&family=Space+Mono:wght@700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    color: #fff;
    font-family: 'Noto Sans Tamil', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  h2 { color: #facc15; font-size: 16px; margin-bottom: 8px; text-align: center; }
  .panel {
    background: #18181b;
    padding: 10px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 12px;
    border: 1px solid #27272a;
  }
  .hint { font-size: 11px; color: #a1a1aa; margin-bottom: 8px; line-height: 1.4; }
  .file-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
  .file-box { background: #222227; padding: 5px; border-radius: 6px; font-size: 9px; color: #e4e4e7; text-align: center; border: 1px dashed #3f3f46; }
  .file-box.loaded { border-color: #4ade80; background: #14291d; }
  .file-box input { width: 100%; margin-top: 3px; font-size: 8px; }
  .btn-row { display: flex; gap: 8px; }
  button {
    flex: 1;
    padding: 11px 6px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  #playBtn { background: #2563eb; color: #fff; }
  #stopBtn { background: #dc2626; color: #fff; flex: 0.45; }
  #exportBtn { background: #facc15; color: #09090b; }
  button:disabled { opacity: 0.45; }
  #status { font-size: 12px; color: #4ade80; margin-top: 8px; text-align: center; font-weight: 600; }
  canvas {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 9 / 16;
    background: #18181b;
    border-radius: 12px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.85);
  }
</style>
</head>
<body>

<h2>🎥 VOX PRO V3 // 8-PHOTO STACK & SATELLITE</h2>

<div class="panel">
  <div class="hint">📸 8 படங்களை வரிசையாக அப்லோட் செய்யுங்கள் (Whip-Pan Stack + Satellite Map + SFX):</div>
  <div class="file-grid">
    <div class="file-box" id="box0">1. கோவில் முழுசு<input type="file" id="img0" accept="image/*"></div>
    <div class="file-box" id="box1">2. சிற்பத் தூண்<input type="file" id="img1" accept="image/*"></div>
    <div class="file-box" id="box2">3. கல் குவாரி<input type="file" id="img2" accept="image/*"></div>
    <div class="file-box" id="box3">4. சாய்வுதளம்<input type="file" id="img3" accept="image/*"></div>
    <div class="file-box" id="box4">5. நிழல் மர்மம்<input type="file" id="img4" accept="image/*"></div>
    <div class="file-box" id="box5">6. 80 டன் கல்<input type="file" id="img5" accept="image/*"></div>
    <div class="file-box" id="box6">7. பூட்டுக் கல்<input type="file" id="img6" accept="image/*"></div>
    <div class="file-box" id="box7">8. சோழர் சாதனை<input type="file" id="img7" accept="image/*"></div>
  </div>
  <div class="btn-row">
    <button id="playBtn" onclick="startPreview()">▶ Preview</button>
    <button id="stopBtn" onclick="stopAll()">⏹ Stop</button>
    <button id="exportBtn" onclick="startExport()">⬇ Export</button>
  </div>
  <div id="status">தயார்! 8 படங்களைத் தேர்வு செய்து Preview அழுத்தவும்</div>
</div>

<canvas id="voxCanvas" width="720" height="1280"></canvas>

<script>
const canvas = document.getElementById('voxCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const W = 720, H = 1280, DURATION = 30, FPS = 30;
let userImgs = new Array(8).fill(null);
let animTimer = null, mediaRecorder = null, startTime = 0;

// Built-in Web Audio SFX Engine
let audioCtx = null, audioDest = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioDest = audioCtx.createMediaStreamDestination();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSFX(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (audioDest) gain.connect(audioDest);

  if (type === 'whoosh') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(42, now + 0.32);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.start(now); osc.stop(now + 0.33);
  } else if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(980, now);
    osc.frequency.exponentialRampToValueAtTime(240, now + 0.07);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'ping') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1250, now);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.start(now); osc.stop(now + 0.25);
  }
}

// Load 8 user images
for (let idx = 0; idx < 8; idx++) {
  document.getElementById(`img${idx}`).addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        userImgs[idx] = img;
        document.getElementById(`box${idx}`).classList.add('loaded');
        drawFrame(0);
        const count = userImgs.filter(Boolean).length;
        statusEl.textContent = `✅ ${count} / 8 படங்கள் லோட் ஆகிவிட்டன!`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Satellite Terrain Map Texture
const satMap = document.createElement('canvas');
satMap.width = 1000; satMap.height = 1000;
const mCtx = satMap.getContext('2d');
(function buildSatellite() {
  mCtx.fillStyle = "#19241e";
  mCtx.fillRect(0, 0, 1000, 1000);
  for (let i = 0; i < 450; i++) {
    const x = Math.random() * 1000, y = Math.random() * 1000;
    const w = 30 + Math.random() * 90, h = 20 + Math.random() * 70;
    mCtx.fillStyle = i % 3 === 0 ? "rgba(38, 62, 46, 0.55)" : (i % 3 === 1 ? "rgba(65, 58, 40, 0.45)" : "rgba(20, 32, 27, 0.6)");
    mCtx.fillRect(x, y, w, h);
  }
  mCtx.strokeStyle = "#163a4d";
  mCtx.lineWidth = 18;
  mCtx.beginPath(); mCtx.moveTo(0, 320); mCtx.bezierCurveTo(350, 380, 650, 290, 1000, 340); mCtx.stroke();
  mCtx.strokeStyle = "rgba(255,255,255,0.07)";
  mCtx.lineWidth = 1;
  for (let g = 0; g < 1000; g += 100) {
    mCtx.beginPath(); mCtx.moveTo(g, 0); mCtx.lineTo(g, 1000); mCtx.stroke();
    mCtx.beginPath(); mCtx.moveTo(0, g); mCtx.lineTo(1000, g); mCtx.stroke();
  }
})();

// Film Grain
const grain = document.createElement('canvas');
grain.width = 180; grain.height = 320;
const gCtx = grain.getContext('2d');
const gData = gCtx.createImageData(180, 320);
for (let i = 0; i < gData.data.length; i += 4) {
  const v = Math.random() * 255;
  gData.data[i] = v; gData.data[i+1] = v; gData.data[i+2] = v; gData.data[i+3] = 14;
}
gCtx.putImageData(gData, 0, 0);

const captions = [
  { start: 0.0, end: 3.75, words: ["ஆயிரம்", "ஆண்டுகளுக்கு", "முன்பு", "கட்டப்பட்ட", "தஞ்சை", "பெரிய", "கோவில்..."] },
  { start: 3.75, end: 7.5, words: ["இன்றும்", "பொறியாளர்களை", "அதிர", "வைக்கும்", "ஒரு", "மர்மம்!"] },
  { start: 7.5, end: 11.25, words: ["60", "கிலோமீட்டர்", "தொலைவிலிருந்து", "கொண்டு", "வரப்பட்ட", "கற்கள்..."] },
  { start: 11.25, end: 15.0, words: ["பிரம்மாண்ட", "சாய்வுதளம்", "வழியாக", "மேலே", "ஏற்றப்பட்ட", "அதிசயம்!"] },
  { start: 15.0, end: 18.75, words: ["216", "அடி", "உயரத்தில்", "நிழலே", "விழாத", "கோபுர", "அமைப்பு!"] },
  { start: 18.75, end: 22.5, words: ["உச்சியில்", "இருக்கும்", "80", "டன்", "ஒற்றைக்", "கல்", "எப்படி", "சென்றது?"] },
  { start: 22.5, end: 26.25, words: ["சிமெண்ட்", "இல்லாமல்", "ஒன்றோடு", "ஒன்று", "பூட்டப்பட்ட", "கற்கள்..."] },
  { start: 26.25, end: 30.0, words: ["சோழர்களின்", "அறிவியல்", "வரலாற்றின்", "அழியாத", "சாதனை!"] }
];

const labels = [
  "FIG 01 // BRIHADEESWARAR 1010 AD",
  "FIG 02 // CHOLA SCULPTURE",
  "FIG 03 // NARTHAMALAI QUARRY",
  "FIG 04 // 6 KM EARTHEN RAMP",
  "FIG 05 // 216 FT VIMANA SHADOW",
  "FIG 06 // 80-TON MONOLITH",
  "FIG 07 // INTERLOCKING GRANITE",
  "FIG 08 // CHOLA ENGINEERING"
];

function drawPhotoCard(img, cx, cy, w, h, rot, scale, labelText, idx) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);

  ctx.fillStyle = "rgba(0,0,0,0.48)";
  ctx.fillRect(-w/2 + 14, -h/2 + 18, w, h);

  ctx.fillStyle = "#f7f3eb";
  ctx.fillRect(-w/2, -h/2, w, h);

  const pad = 16;
  const iw = w - pad*2, ih = h - pad*2 - 36;
  if (img) {
    const rImg = img.width / img.height;
    const rBox = iw / ih;
    let dw, dh;
    if (rImg > rBox) { dh = ih; dw = dh * rImg; }
    else { dw = iw; dh = dw / rImg; }
    ctx.save();
    ctx.beginPath(); ctx.rect(-iw/2, -h/2 + pad, iw, ih); ctx.clip();
    ctx.drawImage(img, -dw/2, -h/2 + pad + (ih - dh)/2, dw, dh);
    ctx.restore();
  } else {
    ctx.fillStyle = "#27272a";
    ctx.fillRect(-iw/2, -h/2 + pad, iw, ih);
    ctx.fillStyle = "#facc15";
    ctx.font = "800 22px 'Noto Sans Tamil'";
    ctx.textAlign = "center";
    ctx.fillText(`படம் ${idx + 1} அப்லோட் செய்யவும்`, 0, -5);
  }

  ctx.fillStyle = "#18181b";
  ctx.font = "bold 18px 'Space Mono'";
  ctx.textAlign = "left";
  ctx.fillText(labelText, -iw/2, h/2 - 14);

  ctx.fillStyle = "rgba(250, 204, 21, 0.85)";
  ctx.fillRect(-65, -h/2 - 12, 130, 24);
  ctx.restore();
}

// 8-Photo Whip-Pan Stack + Satellite Map Overlay (7.5s - 15s)
function renderStage(t) {
  ctx.fillStyle = "#141417";
  ctx.fillRect(0, 0, W, H);

  // Subtle Grid
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  for (let y = 80; y < 800; y += 38) {
    ctx.beginPath(); ctx.moveTo(35, y); ctx.lineTo(685, y); ctx.stroke();
  }

  // Satellite Map Section between 7.5s and 15.0s
  if (t >= 7.5 && t < 15.0) {
    const localT = t - 7.5;
    const p = localT / 7.5;
    ctx.save();
    ctx.beginPath(); ctx.rect(40, 88, 640, 695); ctx.clip();

    const zoom = 1.0 + p * 0.65;
    ctx.save();
    ctx.translate(360, 435);
    ctx.scale(zoom, zoom);
    ctx.translate(-480 + p * 80, -450 + p * 60);
    ctx.drawImage(satMap, 0, 0);

    const qx = 340, qy = 560, tx = 580, ty = 390;
    const routeP = Math.min(p * 1.4, 1);

    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(qx + (tx-qx)*routeP, qy + (ty-qy)*routeP); ctx.stroke();

    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(qx, qy, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "800 16px 'Noto Sans Tamil'";
    ctx.fillText("நார்த்தாமலை குவாரி", qx - 65, qy + 30);

    if (routeP > 0.75) {
      ctx.fillStyle = "#ef4444";
      ctx.beginPath(); ctx.arc(tx, ty, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#facc15";
      ctx.fillText("தஞ்சை கோவில் (60 KM)", tx - 65, ty - 20);
    }
    ctx.restore();

    // Floating Photo Stack PiP for Image 3 (Quarry) & Image 4 (Ramp)
    if (localT < 3.75) {
      const d = Math.min(localT * 4, 1);
      drawPhotoCard(userImgs[2], 520 + (1-d)*300, 620, 260, 260, 0.05, 1, labels[2], 2);
    } else {
      const d = Math.min((localT - 3.75) * 4, 1);
      drawPhotoCard(userImgs[3], 520 + (1-d)*300, 620, 260, 260, -0.04, 1, labels[3], 3);
    }

    ctx.strokeStyle = "#facc15"; ctx.lineWidth = 3;
    ctx.strokeRect(40, 88, 640, 695);
    ctx.restore();
    return;
  }

  // Whip-Pan Stacked Photos for remaining segments (each 3.75s)
  const slot = Math.min(Math.floor(t / 3.75), 7);
  const localT = t - slot * 3.75;
  const drop = Math.min(localT * 4.5, 1);

  // Render previous 2 cards underneath for realistic tabletop photo stack
  for (let i = Math.max(0, slot - 2); i < slot; i++) {
    if (i === 2 || i === 3) continue; // Map segment
    const rot = (i % 2 === 0 ? -1 : 1) * 0.05;
    drawPhotoCard(userImgs[i], 360 + (i%2===0?-18:18), 445, 530, 530, rot, 0.96, labels[i], i);
  }

  // Active Top Card with Whip-Pan entry & smooth Ken Burns zoom
  const dir = slot % 2 === 0 ? -1 : 1;
  const enterX = dir * (1 - drop) * 520;
  const rot = dir * 0.02 * (1 - localT / 3.75);
  const zoom = 1.0 + (localT / 3.75) * 0.09;
  drawPhotoCard(userImgs[slot], 360 + enterX, 445, 545, 545, rot, zoom, labels[slot], slot);

  // Highlight Callout Badges on Key Shots
  if (slot === 4) {
    ctx.fillStyle = "#facc15"; ctx.fillRect(50, 95, 290, 42);
    ctx.fillStyle = "#000"; ctx.font = "900 20px 'Noto Sans Tamil'";
    ctx.fillText("☀️ 216 அடி நிழல் மர்மம்", 65, 123);
  } else if (slot === 5) {
    ctx.fillStyle = "#dc2626"; ctx.fillRect(50, 95, 295, 42);
    ctx.fillStyle = "#fff"; ctx.font = "900 20px 'Noto Sans Tamil'";
    ctx.fillText("🪨 80 டன் ஒற்றைக் கல்!", 65, 123);
  } else if (slot === 6) {
    ctx.fillStyle = "#facc15"; ctx.fillRect(50, 95, 340, 42);
    ctx.fillStyle = "#000"; ctx.font = "900 20px 'Noto Sans Tamil'";
    ctx.fillText("🧩 சிமெண்ட் இல்லாத தொழில்நுட்பம்", 65, 123);
  }
}

function renderSubtitles(t) {
  ctx.fillStyle = "#09090b";
  ctx.fillRect(0, 805, W, 475);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(0, 805, W, 4);

  const cap = captions.find(c => t >= c.start && t <= c.end);
  if (!cap) return;

  const progress = (t - cap.start) / (cap.end - cap.start);
  const activeIdx = Math.min(Math.floor(progress * cap.words.length), cap.words.length - 1);

  let cx = 48, cy = 895;
  const maxW = 624;
  ctx.textAlign = "left";
  ctx.font = "900 35px 'Noto Sans Tamil'";

  cap.words.forEach((word, i) => {
    const ww = ctx.measureText(word).width + 20;
    if (cx + ww > 48 + maxW) { cx = 48; cy += 66; }

    if (i === activeIdx) {
      ctx.save();
      ctx.translate(cx + ww/2, cy - 14);
      ctx.scale(1.07, 1.07);
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-ww/2, -32, ww, 52);
      ctx.fillStyle = "#000";
      ctx.textAlign = "center";
      ctx.fillText(word, 0, 10);
      ctx.restore();
    } else {
      ctx.fillStyle = i < activeIdx ? "#ffffff" : "#71717a";
      ctx.fillText(word, cx + 8, cy - 4);
    }
    cx += ww + 8;
  });

  ctx.fillStyle = "#27272a";
  ctx.fillRect(48, 1220, 624, 10);
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(48, 1220, 624 * Math.min(t / DURATION, 1), 10);
}

function drawFrame(t) {
  ctx.save();
  ctx.translate(Math.sin(t*2.1)*2.5, Math.cos(t*1.8)*2.5);
  renderStage(t);

  ctx.fillStyle = "rgba(9,9,11,0.92)";
  ctx.fillRect(0, 0, W, 68);
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(36, 18, 12, 32);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px 'Space Mono'";
  ctx.textAlign = "left";
  ctx.fillText("VOX DOCUMENTARY // 8-PHOTO ARCHIVE", 58, 41);

  renderSubtitles(t);
  ctx.drawImage(grain, 0, 0, W, H);
  ctx.restore();
}

let triggered = {};
function checkSFX(t) {
  for (let i = 0; i < 8; i++) {
    const cueTime = i * 3.75 + 0.05;
    if (t >= cueTime && !triggered[i]) {
      triggered[i] = true;
      playSFX(i === 3 ? 'ping' : (i === 0 ? 'click' : 'whoosh'));
    }
  }
}

function stopAll() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  document.getElementById('playBtn').disabled = false;
  document.getElementById('exportBtn').disabled = false;
  triggered = {};
  drawFrame(0);
  statusEl.textContent = "⏹ நிறுத்தப்பட்டது";
}

function startPreview() {
  stopAll();
  initAudio();
  document.getElementById('playBtn').disabled = true;
  startTime = Date.now();

  animTimer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    if (elapsed >= DURATION) {
      drawFrame(DURATION - 0.01);
      clearInterval(animTimer); animTimer = null;
      document.getElementById('playBtn').disabled = false;
      statusEl.textContent = "✅ Preview முடிந்தது! Export அழுத்தவும்.";
      return;
    }
    checkSFX(elapsed);
    drawFrame(elapsed);
    statusEl.textContent = `▶ Preview: ${Math.floor(elapsed)}s / 30s`;
  }, 1000 / FPS);
}

function startExport() {
  stopAll();
  initAudio();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('exportBtn').disabled = true;

  const videoStream = canvas.captureStream(FPS);
  const combinedTracks = [...videoStream.getVideoTracks()];
  if (audioDest) combinedTracks.push(...audioDest.stream.getAudioTracks());
  const fullStream = new MediaStream(combinedTracks);

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(fullStream, { mimeType: mime, videoBitsPerSecond: 5000000 });
  const chunks = [];

  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    if (chunks.length > 0) {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'vox_8photo_documentary_30s.webm';
      a.click();
      statusEl.textContent = "✅ 8-Photo Pro Video டவுன்லோட் ஆகிவிட்டது!";
    }
    document.getElementById('playBtn').disabled = false;
    document.getElementById('exportBtn').disabled = false;
  };

  mediaRecorder.start();
  startTime = Date.now();

  animTimer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    if (elapsed >= DURATION) {
      drawFrame(DURATION - 0.01);
      clearInterval(animTimer); animTimer = null;
      mediaRecorder.stop();
      return;
    }
    checkSFX(elapsed);
    drawFrame(elapsed);
    statusEl.textContent = `⏳ Export ரெக்கார்டிங்: ${Math.floor(elapsed)}s / 30s`;
  }, 1000 / FPS);
}

drawFrame(0);
</script>
