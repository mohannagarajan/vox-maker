<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vox Pro Studio // 2.5D History Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@600;800;900&family=Space+Mono:wght@700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0f;
    color: #fff;
    font-family: 'Noto Sans Tamil', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
  }
  h2 { color: #facc15; font-size: 17px; margin-bottom: 10px; text-align: center; }
  .panel {
    background: #18181b;
    padding: 12px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 14px;
    border: 1px solid #2e2e34;
  }
  .file-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .file-box { background: #222227; padding: 6px; border-radius: 6px; font-size: 10px; color: #d4d4d8; text-align: center; }
  .file-box input { width: 100%; margin-top: 4px; font-size: 9px; }
  .btn-row { display: flex; gap: 8px; }
  button {
    flex: 1;
    padding: 11px 6px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  #playBtn { background: #2563eb; color: #fff; }
  #stopBtn { background: #ef4444; color: #fff; flex: 0.5; }
  #exportBtn { background: #facc15; color: #09090b; }
  button:disabled { opacity: 0.45; }
  #status { font-size: 12px; color: #4ade80; margin-top: 8px; text-align: center; font-weight: 600; }
  canvas {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 9 / 16;
    background: #efe9db;
    border-radius: 12px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<h2>🎬 VOX PRO ENGINE // வரலாற்று மர்மம் (30s)</h2>

<div class="panel">
  <div class="file-row">
    <div class="file-box">1. கோவில் முழு படம்<input type="file" id="img0" accept="image/*"></div>
    <div class="file-box">2. கோபுர உச்சி கல்<input type="file" id="img1" accept="image/*"></div>
    <div class="file-box">3. சோழர் சிற்பம்<input type="file" id="img2" accept="image/*"></div>
  </div>
  <div class="btn-row">
    <button id="playBtn" onclick="startPreview()">▶ Preview</button>
    <button id="stopBtn" onclick="stopAll()">⏹ Stop</button>
    <button id="exportBtn" onclick="startExport()">⬇ Export</button>
  </div>
  <div id="status">தயார்! Preview அல்லது Export அழுத்தவும்</div>
</div>

<canvas id="voxCanvas" width="720" height="1280"></canvas>

<script>
const canvas = document.getElementById('voxCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const W = 720;
const H = 1280;
const DURATION = 30;
const FPS = 30;

let userImgs = [null, null, null];
let animTimer = null;
let mediaRecorder = null;
let startTime = 0;

// Load images
[0, 1, 2].forEach(idx => {
  document.getElementById(`img${idx}`).addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => { userImgs[idx] = img; drawFrame(0); statusEl.textContent = `✅ படம் ${idx+1} சேர்க்கப்பட்டது!`; };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
});

// Lightweight Film Grain (Generated once for fast mobile playback)
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 180; grainCanvas.height = 320;
const gCtx = grainCanvas.getContext('2d');
const imgData = gCtx.createImageData(180, 320);
for (let i = 0; i < imgData.data.length; i += 4) {
  const v = Math.random() * 255;
  imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 14;
}
gCtx.putImageData(imgData, 0, 0);

const captions = [
  { start: 0.0, end: 3.5, words: ["ஆயிரம்", "ஆண்டுகளுக்கு", "முன்பு", "கட்டப்பட்ட", "தஞ்சை", "பெரிய", "கோவில்..."] },
  { start: 3.5, end: 7.0, words: ["இன்றும்", "பொறியாளர்களை", "அதிர", "வைக்கும்", "ஒரு", "மர்மம்!"] },
  { start: 7.0, end: 11.2, words: ["60", "கிலோமீட்டர்", "தொலைவிலிருந்து", "கொண்டு", "வரப்பட்ட", "கற்கள்..."] },
  { start: 11.2, end: 15.0, words: ["216", "அடி", "உயரத்தில்", "நிழலே", "விழாத", "அதிசயம்!"] },
  { start: 15.0, end: 19.2, words: ["கோபுர", "உச்சியில்", "இருக்கும்", "80", "டன்", "ஒற்றைக்", "கல்..."] },
  { start: 19.2, end: 23.0, words: ["கிரேன்கள்", "இல்லாத", "காலத்தில்", "எப்படி", "மேலே", "சென்றது?"] },
  { start: 23.0, end: 26.8, words: ["அஸ்திவாரமே", "இல்லாமல்", "புவியீர்ப்பு", "விசையை", "வென்ற..."] },
  { start: 26.8, end: 30.0, words: ["சோழர்களின்", "அறிவியல்", "வரலாற்றின்", "அழியாத", "சாதனை!"] }
];

function drawTornCard(x, y, w, h, seed, drawContentFn) {
  ctx.save();
  const jag = 8;
  const step = 20;
  ctx.beginPath();
  for (let px = x; px <= x + w; px += step) {
    const dy = Math.sin(px * 0.15 + seed) * jag;
    if (px === x) ctx.moveTo(px, y + dy);
    else ctx.lineTo(px, y + dy);
  }
  ctx.lineTo(x + w, y + h);
  for (let px = x + w; px >= x; px -= step) {
    const dy = Math.cos(px * 0.19 + seed) * jag;
    ctx.lineTo(px, y + h + dy);
  }
  ctx.closePath();

  ctx.save();
  ctx.translate(12, 15);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = "#faf6ee";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#d6cfc2";
  ctx.stroke();

  ctx.clip();
  drawContentFn();
  ctx.restore();
}

function applyCameraAndBackground(t) {
  const shakeX = Math.sin(t * 2.3) * 3.5;
  const shakeY = Math.cos(t * 1.9) * 3.5;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle = "#efe8d8";
  ctx.fillRect(-20, -20, W + 40, H + 40);

  ctx.strokeStyle = "rgba(120, 100, 70, 0.12)";
  ctx.lineWidth = 1.5;
  const shift = (t * 15) % 40;
  for (let x = shift; x < W + 40; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = shift; y < H + 40; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.fillStyle = "#141417";
  ctx.fillRect(0, 0, W, 72);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(36, 20, 12, 32);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px 'Space Mono', monospace";
  ctx.textAlign = "left";
  ctx.fillText("VOX ARCHIVE // CHOLA MYSTERY", 58, 43);

  ctx.fillStyle = "#dc2626";
  ctx.fillRect(560, 20, 120, 32);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 18px 'Space Mono', monospace";
  ctx.fillText("1010 AD", 582, 42);
}

function renderScene1(t) {
  const p = t / 7;
  ctx.fillStyle = "#18181b";
  ctx.fillRect(46, 95, 628, 48);
  ctx.strokeStyle = "#facc15";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(75, 120); ctx.lineTo(645, 120); ctx.stroke();

  const years = ["985 AD", "1003 AD", "1010 AD", "2026 AD"];
  years.forEach((yr, i) => {
    const x = 95 + i * 172;
    const active = p >= i * 0.22;
    ctx.fillStyle = active ? "#facc15" : "#52525b";
    ctx.beginPath(); ctx.arc(x, 120, active ? 8 : 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = "bold 16px 'Space Mono'";
    ctx.fillText(yr, x - 28, 108);
  });

  drawTornCard(52, 172, 616, 585, 1.2, () => {
    const skyGrad = ctx.createLinearGradient(52, 172, 52, 757);
    skyGrad.addColorStop(0, "#1e293b");
    skyGrad.addColorStop(0.6, "#b45309");
    skyGrad.addColorStop(1, "#f59e0b");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(52, 172, 616, 585);

    ctx.fillStyle = "rgba(254, 240, 138, 0.85)";
    ctx.beginPath();
    ctx.arc(510 - p * 60, 305 + p * 20, 72, 0, Math.PI * 2);
    ctx.fill();

    if (userImgs[0]) {
      const scaleBg = 1.04 + p * 0.14;
      ctx.save();
      ctx.translate(360 - p * 25, 465);
      ctx.scale(scaleBg, scaleBg);
      ctx.drawImage(userImgs[0], -308, -292, 616, 585);
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(-p * 35, 0);
      ctx.fillStyle = "#451a03";
      ctx.fillRect(80, 570, 580, 190);
      ctx.restore();

      ctx.save();
      ctx.translate(360 + p * 30, 745);
      ctx.scale(1 + p * 0.16, 1 + p * 0.16);
      ctx.fillStyle = "#271003";
      for (let tier = 0; tier < 13; tier++) {
        const w = 250 - tier * 16;
        const y = -tier * 30 - 30;
        ctx.fillRect(-w / 2, y, w, 28);
        ctx.fillStyle = "#d97706";
        ctx.fillRect(-w / 2, y, w, 4);
        ctx.fillStyle = "#271003";
      }
      ctx.beginPath(); ctx.arc(0, -425, 28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.moveTo(-7, -450); ctx.lineTo(0, -490); ctx.lineTo(7, -450); ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = "#facc15";
    ctx.fillRect(74, 196, 250, 38);
    ctx.fillStyle = "#000";
    ctx.font = "800 20px 'Noto Sans Tamil'";
    ctx.fillText("216 அடி பிரம்மாண்டம்", 88, 222);
  });
}

function renderScene2(localT) {
  const p = Math.min(localT / 8, 1);

  drawTornCard(52, 148, 616, 625, 3.4, () => {
    ctx.fillStyle = "#1c242b";
    ctx.fillRect(52, 148, 616, 625);

    ctx.save();
    const zoom = 1 + p * 0.42;
    ctx.translate(360, 455);
    ctx.scale(zoom, zoom);
    ctx.translate(-360 + p * 25, -455 + p * 20);

    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(100, 300);
    ctx.quadraticCurveTo(300, 330, 585, 285);
    ctx.stroke();
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 14px 'Space Mono'";
    ctx.fillText("CAUVERY RIVER", 410, 275);

    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 1.5;
    for (let r = 55; r <= 270; r += 55) {
      ctx.beginPath(); ctx.arc(215, 520, r, 0, Math.PI * 2); ctx.stroke();
    }

    const startX = 185, startY = 545;
    const endX = 495, endY = 360;
    const routeProg = Math.min(p * 1.4, 1);

    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = "rgba(250, 204, 21, 0.35)";
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke();

    ctx.setLineDash([]);
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(startX + (endX - startX) * routeProg, startY + (endY - startY) * routeProg);
    ctx.stroke();

    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(startX, startY, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "800 17px 'Noto Sans Tamil'";
    ctx.fillText("நார்த்தாமலை (கல் குவாரி)", startX - 60, startY + 36);

    if (routeProg > 0.85) {
      const pulse = 12 + Math.sin(localT * 10) * 4;
      ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
      ctx.beginPath(); ctx.arc(endX, endY, pulse + 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ef4444";
      ctx.beginPath(); ctx.arc(endX, endY, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#facc15";
      ctx.fillText("தஞ்சாவூர் கோவில்", endX - 75, endY - 22);
    }
    ctx.restore();

    ctx.fillStyle = "#facc15";
    ctx.fillRect(74, 170, 290, 42);
    ctx.fillStyle = "#000";
    ctx.font = "800 21px 'Noto Sans Tamil'";
    ctx.fillText("📍 தூரம்: 60 கி.மீ பயணம்", 88, 198);
  });
}

function renderScene3(localT) {
  const barAnim = Math.min(localT * 1.2, 1);

  drawTornCard(52, 148, 616, 625, 5.8, () => {
    ctx.fillStyle = "#18181b";
    ctx.fillRect(52, 148, 616, 625);

    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    for (let y = 225; y <= 680; y += 75) {
      ctx.beginPath(); ctx.moveTo(80, y); ctx.lineTo(640, y); ctx.stroke();
    }

    ctx.fillStyle = "#facc15";
    ctx.font = "800 24px 'Noto Sans Tamil'";
    ctx.fillText("📊 பிரம்மாண்ட ஒப்பீடு (SCALE DATA)", 80, 198);

    const h1 = 120 * barAnim;
    const h2 = 345 * barAnim;

    ctx.fillStyle = "#52525b";
    ctx.fillRect(125, 640 - h1, 105, h1);
    ctx.fillStyle = "#d4d4d8";
    ctx.font = "bold 18px 'Noto Sans Tamil'";
    ctx.fillText("சாதாரண கோபுரம்", 108, 672);
    ctx.fillText("60 அடி", 145, 640 - h1 - 12);

    ctx.fillStyle = "#facc15";
    ctx.fillRect(285, 640 - h2, 120, h2);
    ctx.fillStyle = "#facc15";
    ctx.font = "800 21px 'Noto Sans Tamil'";
    ctx.fillText("தஞ்சை கோபுரம்", 275, 672);
    ctx.fillText("216 அடி!", 300, 640 - h2 - 14);

    ctx.fillStyle = "#27272a";
    ctx.fillRect(440, 280, 195, 360);
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 3;
    ctx.strokeRect(440, 280, 195, 360);

    if (userImgs[1]) {
      ctx.drawImage(userImgs[1], 454, 294, 167, 160);
    } else {
      ctx.fillStyle = "#a8a29e";
      ctx.beginPath();
      ctx.arc(537, 385, 56, Math.PI, 0);
      ctx.fillRect(481, 385, 112, 36);
      ctx.fill();
    }

    ctx.fillStyle = "#ef4444";
    ctx.font = "900 32px 'Space Mono'";
    ctx.fillText("80 TONS", 464, 502);
    ctx.fillStyle = "#fff";
    ctx.font = "800 19px 'Noto Sans Tamil'";
    ctx.fillText("ஒற்றைக் கல்!", 478, 536);
    ctx.fillStyle = "#facc15";
    ctx.font = "600 16px 'Noto Sans Tamil'";
    ctx.fillText("= 16 யானைகளின்", 464, 575);
    ctx.fillText("மொத்த எடை!", 478, 602);
  });
}

function renderScene4(localT) {
  const p = Math.min(localT / 7, 1);

  drawTornCard(52, 148, 616, 625, 8.1, () => {
    if (userImgs[2]) {
      ctx.save();
      ctx.translate(360, 460);
      ctx.scale(1.04 + p * 0.16, 1.04 + p * 0.16);
      ctx.drawImage(userImgs[2], -308, -312, 616, 625);
      ctx.restore();
    } else {
      ctx.fillStyle = "#1c1917";
      ctx.fillRect(52, 148, 616, 625);
      const slide = Math.max(0, (1 - localT * 1.5)) * 120;

      ctx.fillStyle = "#78716c";
      ctx.fillRect(108 - slide, 300, 240, 145);
      ctx.fillStyle = "#a8a29e";
      ctx.fillRect(360 + slide, 300, 240, 145);
      ctx.fillStyle = "#57534e";
      ctx.fillRect(160, 460 + slide, 400, 145);

      if (slide < 8) {
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 5;
        ctx.strokeRect(344, 320, 30, 105);
      }
    }

    ctx.save();
    ctx.translate(360, 228);
    ctx.rotate(-0.03);
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(-250, -30, 500, 60);
    ctx.fillStyle = "#fff";
    ctx.font = "900 24px 'Noto Sans Tamil'";
    ctx.textAlign = "center";
    ctx.fillText("சிமெண்ட் இல்லை • அஸ்திவாரம் இல்லை!", 0, 9);
    ctx.restore();
  });
}

function renderKineticSubtitles(t) {
  const cap = captions.find(c => t >= c.start && t <= c.end);
  if (!cap) return;

  const progress = (t - cap.start) / (cap.end - cap.start);
  const activeIdx = Math.min(Math.floor(progress * cap.words.length), cap.words.length - 1);

  let cursorX = 56;
  let cursorY = 840;
  const maxW = 608;

  ctx.textAlign = "left";
  ctx.font = "900 35px 'Noto Sans Tamil'";

  cap.words.forEach((word, i) => {
    const wWidth = ctx.measureText(word).width + 18;
    if (cursorX + wWidth > 56 + maxW) {
      cursorX = 56;
      cursorY += 64;
    }

    const isCurrent = i === activeIdx;
    const isPast = i < activeIdx;

    if (isCurrent) {
      ctx.save();
      ctx.translate(cursorX + wWidth / 2, cursorY - 14);
      ctx.scale(1.06, 1.06);
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-wWidth / 2, -30, wWidth, 50);
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.fillText(word, 0, 9);
      ctx.restore();
    } else {
      ctx.fillStyle = isPast ? "#18181b" : "rgba(24, 24, 27, 0.45)";
      ctx.fillText(word, cursorX + 6, cursorY - 5);
    }

    cursorX += wWidth + 6;
  });
}

function renderOverlays(t) {
  ctx.drawImage(grainCanvas, 0, 0, W, H);

  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(52, 1210, 616, 10);
  ctx.fillStyle = "#dc2626";
  ctx.fillRect(52, 1210, 616 * Math.min(t / DURATION, 1), 10);
}

function drawFrame(t) {
  applyCameraAndBackground(t);
  if (t < 7) renderScene1(t);
  else if (t < 15) renderScene2(t - 7);
  else if (t < 23) renderScene3(t - 15);
  else renderScene4(t - 23);
  renderKineticSubtitles(t);
  renderOverlays(t);
  ctx.restore();
}

function stopAll() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); }
  document.getElementById('playBtn').disabled = false;
  document.getElementById('exportBtn').disabled = false;
  drawFrame(0);
  statusEl.textContent = "⏹ நிறுத்தப்பட்டது (Reset)";
}

function startPreview() {
  stopAll();
  document.getElementById('playBtn').disabled = true;
  startTime = Date.now();
  statusEl.textContent = "▶ Preview ஓடுகிறது: 0s / 30s";

  animTimer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    if (elapsed >= DURATION) {
      drawFrame(DURATION - 0.01);
      clearInterval(animTimer);
      animTimer = null;
      document.getElementById('playBtn').disabled = false;
      statusEl.textContent = "✅ Preview முடிந்தது! Export அழுத்தவும்.";
      return;
    }
    drawFrame(elapsed);
    statusEl.textContent = `▶ Preview ஓடுகிறது: ${Math.floor(elapsed)}s / 30s`;
  }, 1000 / FPS);
}

function startExport() {
  stopAll();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('exportBtn').disabled = true;

  const stream = canvas.captureStream(FPS);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4500000 });
  const chunks = [];

  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    if (chunks.length > 0) {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'vox_pro_thanjavur_30s.webm';
      a.click();
      statusEl.textContent = "✅ Pro Video டவுன்லோட் ஆகிவிட்டது!";
    }
    document.getElementById('playBtn').disabled = false;
    document.getElementById('exportBtn').disabled = false;
  };

  mediaRecorder.start();
  startTime = Date.now();
  statusEl.textContent = "⏳ Export ரெக்கார்டிங்: 0s / 30s";

  animTimer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    if (elapsed >= DURATION) {
      drawFrame(DURATION - 0.01);
      clearInterval(animTimer);
      animTimer = null;
      mediaRecorder.stop();
      return;
    }
    drawFrame(elapsed);
    statusEl.textContent = `⏳ Export ரெக்கார்டிங்: ${Math.floor(elapsed)}s / 30s`;
  }, 1000 / FPS);
}

drawFrame(0);
</script>
</body>
</html>
