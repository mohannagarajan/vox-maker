<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">

<title>Vox Pro Studio // 2.5D History Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@600;800;900&family=Space+Mono:wght@700&display=swap');

    background: #efe9db;

<body>

<h2>🎬 VOX PRO ENGINE // வரலாற்று மர்மம் (30s)</h2>

<div class="panel">
  <div class="hint">💡 படங்கள் அப்லோட் செய்யாமலேயே Map, Infographics & 2.5D Layers ஓடும். விருப்பமிருந்தால் 3 படங்கள் சேர்க்கலாம்:</div>
  <div class="file-row">

    <div class="file-box">2. கோபுர உச்சி கல்<input type="file" id="img1" accept="image/*"></div>
    <div class="file-box">3. சோழர் சிற்பம்<input type="file" id="img2" accept="image/*"></div>

<canvas id="voxCanvas" width="1080" height="1920"></canvas>

<script>
const canvas = document.getElementById('voxCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const DURATION = 30;
const FPS = 30;
let userImgs = [null, null, null];
let isPlaying = false;
let startTime = 0;

// Load optional user images
[0, 1, 2].forEach(idx => {
  document.getElementById(`img${idx}`).addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => { userImgs[idx] = img; drawFrame(0); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
});

// Pre-generate procedural Film Grain & Torn Edge Noise
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 270; grainCanvas.height = 480;
const gCtx = grainCanvas.getContext('2d');
function refreshGrain() {
  const imgData = gCtx.createImageData(270, 480);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 16;
  }
  gCtx.putImageData(imgData, 0, 0);
}
refreshGrain();

// Word-by-word Kinetic Subtitles Synced to 30s
const captions = [
  { start: 0.2, end: 3.5, words: ["ஆயிரம்", "ஆண்டுகளுக்கு", "முன்பு", "கட்டப்பட்ட", "தஞ்சை", "பெரிய", "கோவில்..."] },
  { start: 3.5, end: 7.0, words: ["இன்றும்", "பொறியாளர்களை", "அதிர", "வைக்கும்", "ஒரு", "மர்மம்!"] },
  { start: 7.2, end: 11.2, words: ["60", "கிலோமீட்டர்", "தொலைவிலிருந்து", "கொண்டு", "வரப்பட்ட", "கற்கள்..."] },
  { start: 11.2, end: 15.0, words: ["216", "அடி", "உயரத்தில்", "நிழலே", "விழாத", "அதிசயம்!"] },
  { start: 15.2, end: 19.2, words: ["கோபுர", "உச்சியில்", "இருக்கும்", "80", "டன்", "ஒற்றைக்", "கல்..."] },
  { start: 19.2, end: 23.0, words: ["கிரேன்கள்", "இல்லாத", "காலத்தில்", "எப்படி", "மேலே", "சென்றது?"] },
  { start: 23.2, end: 26.8, words: ["அஸ்திவாரமே", "இல்லாமல்", "புவியீர்ப்பு", "விசையை", "வென்ற..."] },
  { start: 26.8, end: 30.0, words: ["சோழர்களின்", "அறிவியல்", "வரலாற்றின்", "அழியாத", "சாதனை!"] }
];

// Helper: Torn Paper Polygon Clip/Frame
function drawTornCard(x, y, w, h, seed, drawContentFn) {
  ctx.save();
  const jag = 12;
  const step = 28;
  ctx.beginPath();
  // Top torn edge
  for (let px = x; px <= x + w; px += step) {
    const dy = Math.sin(px * 0.13 + seed) * jag;
    if (px === x) ctx.moveTo(px, y + dy);
    else ctx.lineTo(px, y + dy);
  }
  // Right edge
  ctx.lineTo(x + w, y + h);
  // Bottom torn edge
  for (let px = x + w; px >= x; px -= step) {
    const dy = Math.cos(px * 0.17 + seed) * jag;
    ctx.lineTo(px, y + h + dy);
  }
  ctx.closePath();

  // Drop Shadow
  ctx.save();
  ctx.translate(18, 22);
  ctx.fillStyle = "rgba(0,0,0,0.32)";
  ctx.fill();
  ctx.restore();

  // Paper Border
  ctx.fillStyle = "#faf6ee";
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#d6cfc2";
  ctx.stroke();

  // Clip inner content
  ctx.clip();
  drawContentFn();
  ctx.restore();
}

// Background Parchment + Blueprint Grid + Camera Micro-Shake
function applyCameraAndBackground(t) {
  const shakeX = Math.sin(t * 2.3) * 5 + Math.cos(t * 5.1) * 2;
  const shakeY = Math.cos(t * 1.9) * 5 + Math.sin(t * 4.7) * 2;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Vintage Parchment Base
  const grad = ctx.createRadialGradient(540, 960, 100, 540, 960, 1200);
  grad.addColorStop(0, "#f5f0e6");
  grad.addColorStop(1, "#dfd6c3");
  ctx.fillStyle = grad;
  ctx.fillRect(-30, -30, 1140, 1980);

  // Architectural Blueprint Lines
  ctx.strokeStyle = "rgba(120, 100, 70, 0.12)";
  ctx.lineWidth = 2;
  const shift = (t * 20) % 60;
  for (let x = shift; x < 1100; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke();
  }
  for (let y = shift; y < 1940; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1100, y); ctx.stroke();
  }

  // Top Editorial Header
  ctx.fillStyle = "#141417";
  ctx.fillRect(0, 0, 1080, 105);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(55, 30, 16, 45);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 32px 'Space Mono', monospace";
  ctx.textAlign = "left";
  ctx.fillText("VOX ARCHIVE // CHOLA MYSTERY", 88, 63);

  ctx.fillStyle = "#dc2626";
  ctx.fillRect(850, 30, 175, 45);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 26px 'Space Mono', monospace";
  ctx.fillText("1010 AD", 882, 61);
}

// SCENE 1 (0 - 7s): 2.5D Parallax Temple + Timeline
function renderScene1(t) {
  const p = t / 7;
  // Animated 1010 AD Timeline Bar at Top
  ctx.fillStyle = "#18181b";
  ctx.fillRect(70, 145, 940, 70);
  ctx.strokeStyle = "#facc15";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(110, 180); ctx.lineTo(970, 180); ctx.stroke();

  const years = ["985 AD", "1003 AD", "1010 AD", "2026 AD"];
  years.forEach((yr, i) => {
    const x = 140 + i * 260;
    const active = p >= i * 0.22;
    ctx.fillStyle = active ? "#facc15" : "#52525b";
    ctx.beginPath(); ctx.arc(x, 180, active ? 12 : 7, 0, Math.PI * 2); ctx.fill();
    ctx.font = "bold 24px 'Space Mono'";
    ctx.fillText(yr, x - 42, 160);
  });

  // 2.5D Parallax Cutout Card
  drawTornCard(80, 260, 920, 880, 1.2, () => {
    // Layer 1: Sky / Sun (Moves Slow)
    const skyGrad = ctx.createLinearGradient(80, 260, 80, 1140);
    skyGrad.addColorStop(0, "#1e293b");
    skyGrad.addColorStop(0.6, "#b45309");
    skyGrad.addColorStop(1, "#f59e0b");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(80, 260, 920, 880);

    // Sun Disk Parallax
    ctx.fillStyle = "rgba(254, 240, 138, 0.85)";
    ctx.beginPath();
    ctx.arc(760 - p * 90, 460 + p * 30, 110, 0, Math.PI * 2);
    ctx.fill();

    if (userImgs[0]) {
      // Background & Foreground 2.5D Split Simulation
      const scaleBg = 1.05 + p * 0.1;
      ctx.save();
      ctx.translate(540 - p * 40, 700);
      ctx.scale(scaleBg, scaleBg);
      ctx.drawImage(userImgs[0], -460, -440, 920, 880);
      ctx.restore();
    } else {
      // Procedural 2.5D Layered Temple Silhouette (Midground + Foreground)
      // Midground Mandapam (Medium Speed)
      ctx.save();
      ctx.translate(-p * 55, 0);
      ctx.fillStyle = "#451a03";
      ctx.fillRect(120, 860, 880, 280);
      ctx.restore();

      // Foreground 13-Tier Vimana Tower (Fast Zoom & Parallax)
      ctx.save();
      ctx.translate(540 + p * 45, 1120);
      ctx.scale(1 + p * 0.16, 1 + p * 0.16);
      ctx.fillStyle = "#271003";
      for (let tier = 0; tier < 13; tier++) {
        const w = 380 - tier * 24;
        const y = -tier * 46 - 46;
        ctx.fillRect(-w / 2, y, w, 42);
        // Gold highlights on tiers
        ctx.fillStyle = "#d97706";
        ctx.fillRect(-w / 2, y, w, 6);
        ctx.fillStyle = "#271003";
      }
      // Kalasam Dome
      ctx.beginPath(); ctx.arc(0, -640, 42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.moveTo(-10, -680); ctx.lineTo(0, -740); ctx.lineTo(10, -680); ctx.fill();
      ctx.restore();
    }

    // Vox Cutout Label Badge
    ctx.fillStyle = "#facc15";
    ctx.fillRect(110, 295, 360, 54);
    ctx.fillStyle = "#000";
    ctx.font = "800 30px 'Noto Sans Tamil'";
    ctx.fillText("216 அடி பிரம்மாண்டம்", 130, 332);
  });
}

// SCENE 2 (7 - 15s): Animated Map Zoom & Red Route Line
function renderScene2(localT) {
  const p = Math.min(localT / 8, 1);

  drawTornCard(80, 220, 920, 940, 3.4, () => {
    // Dark Topographic Map Base
    ctx.fillStyle = "#1c242b";
    ctx.fillRect(80, 220, 920, 940);

    // Map Zoom Transform
    ctx.save();
    const zoom = 1 + p * 0.45;
    ctx.translate(540, 680);
    ctx.scale(zoom, zoom);
    ctx.translate(-540 + p * 40, -680 + p * 30);

    // Stylized Tamil Nadu Coastline & Cauvery River
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(150, 450);
    ctx.quadraticCurveTo(450, 490, 880, 430);
    ctx.stroke();
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 20px 'Space Mono'";
    ctx.fillText("CAUVERY RIVER", 620, 415);

    // Topographic Contour Rings
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 2;
    for (let r = 80; r <= 400; r += 80) {
      ctx.beginPath(); ctx.arc(320, 780, r, 0, Math.PI * 2); ctx.stroke();
    }

    // Route Line: Narthamalai Quarry -> Thanjavur Temple (60 KM)
    const startX = 280, startY = 820;
    const endX = 740, endY = 540;
    const routeProg = Math.min(p * 1.4, 1);

    // Dashed Background Path
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = "rgba(250, 204, 21, 0.35)";
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke();

    // Animated Red/Yellow Active Route Line
    ctx.setLineDash([]);
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(startX + (endX - startX) * routeProg, startY + (endY - startY) * routeProg);
    ctx.stroke();

    // Origin Pin (Narthamalai)
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(startX, startY, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "800 26px 'Noto Sans Tamil'";
    ctx.fillText("நார்த்தாமலை (கல் குவாரி)", startX - 90, startY + 52);

    // Destination Pin (Thanjavur)
    if (routeProg > 0.85) {
      const pulse = 18 + Math.sin(localT * 10) * 6;
      ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
      ctx.beginPath(); ctx.arc(endX, endY, pulse + 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ef4444";
      ctx.beginPath(); ctx.arc(endX, endY, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#facc15";
      ctx.fillText("தஞ்சாவூர் கோவில்", endX - 110, endY - 32);
    }
    ctx.restore();

    // Distance Callout Box
    ctx.fillStyle = "#facc15";
    ctx.fillRect(110, 255, 430, 62);
    ctx.fillStyle = "#000";
    ctx.font = "800 32px 'Noto Sans Tamil'";
    ctx.fillText("📍 தூரம்: 60 கி.மீ பயணம்", 130, 297);
  });
}

// SCENE 3 (15 - 23s): Animated Scale & Weight Infographics
function renderScene3(localT) {
  const p = Math.min(localT / 8, 1);
  const barAnim = Math.min(localT * 1.2, 1);

  drawTornCard(80, 220, 920, 940, 5.8, () => {
    ctx.fillStyle = "#18181b";
    ctx.fillRect(80, 220, 920, 940);

    // Grid inside chart
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    for (let y = 340; y <= 1020; y += 110) {

    const h1 = 180 * barAnim;

    // Normal Building Bar

    ctx.fillText("60 அடி", 220, 960 - h1 - 18);

    // Thanjavur 216 ft Bar
    ctx.fillStyle = "#facc15";
    ctx.fillRect(430, 960 - h2, 180, h2);
    ctx.fillStyle = "#facc15";
    ctx.font = "800 32px 'Noto Sans Tamil'";
    ctx.fillText("தஞ்சை கோபுரம்", 415, 1005);
    ctx.fillText("216 அடி!", 450, 960 - h2 - 20);

    // Right Side: 80-Ton Capstone Card
    ctx.fillStyle = "#27272a";
    ctx.fillRect(660, 420, 290, 540);
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 4;
    ctx.strokeRect(660, 420, 290, 540);

    if (userImgs[1]) {
      ctx.drawImage(userImgs[1], 680, 440, 250, 240);
    } else {
      // Drawn 80-Ton Monolith Block
      ctx.fillStyle = "#a8a29e";
      ctx.beginPath();
      ctx.arc(805, 580, 85, Math.PI, 0);
      ctx.fillRect(720, 580, 170, 55);
      ctx.fill();
    }

    ctx.fillStyle = "#ef4444";
    ctx.font = "900 48px 'Space Mono'";
    ctx.fillText("80 TONS", 695, 755);
    ctx.fillStyle = "#fff";
    ctx.font = "800 28px 'Noto Sans Tamil'";
    ctx.fillText("ஒற்றைக் கல்!", 715, 805);
    ctx.fillStyle = "#facc15";
    ctx.font = "600 24px 'Noto Sans Tamil'";
    ctx.fillText("= 16 யானைகளின்", 695, 865);
    ctx.fillText("மொத்த எடை!", 715, 905);
  });
}

// SCENE 4 (23 - 30s): Climax Cutout + Interlocking Tech
function renderScene4(localT) {
  const p = Math.min(localT / 7, 1);

  drawTornCard(80, 220, 920, 940, 8.1, () => {
    if (userImgs[2]) {
      ctx.save();
      ctx.translate(540, 690);
      ctx.scale(1.05 + p * 0.18, 1.05 + p * 0.18);
      ctx.drawImage(userImgs[2], -460, -470, 920, 940);
      ctx.restore();
    } else {
      // Interlocking Stone Blocks Animation
      ctx.fillStyle = "#1c1917";
      ctx.fillRect(80, 220, 920, 940);
      const slide = Math.max(0, (1 - localT * 1.5)) * 180;

      ctx.fillStyle = "#78716c";
      ctx.fillRect(160 - slide, 450, 360, 220);
      ctx.fillStyle = "#a8a29e";
      ctx.fillRect(540 + slide, 450, 360, 220);
      ctx.fillStyle = "#57534e";
      ctx.fillRect(240, 690 + slide, 600, 220);

      // Gold Puzzle Lock Highlight
      if (slide < 10) {
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 8;
        ctx.strokeRect(515, 480, 45, 160);
      }
    }

    // Stamp Badge
    ctx.save();
    ctx.translate(540, 340);
    ctx.rotate(-0.04);
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(-360, -45, 720, 90);
    ctx.fillStyle = "#fff";
    ctx.font = "900 38px 'Noto Sans Tamil'";
    ctx.textAlign = "center";
    ctx.fillText("சிமெண்ட் இல்லை • அஸ்திவாரம் இல்லை!", 0, 14);
    ctx.restore();
  });
}

// Word-by-Word Kinetic Subtitles Engine
function renderKineticSubtitles(t) {
  const cap = captions.find(c => t >= c.start && t <= c.end);
  if (!cap) return;

  const progress = (t - cap.start) / (cap.end - cap.start);
  const activeIdx = Math.min(Math.floor(progress * cap.words.length), cap.words.length - 1);

  const boxY = 1260;
  ctx.textAlign = "left";
  ctx.font = "900 54px 'Noto Sans Tamil'";

  let cursorX = 85;
  let cursorY = boxY;
  const maxW = 910;

  cap.words.forEach((word, i) => {
    const wWidth = ctx.measureText(word).width + 26;
    if (cursorX + wWidth > 85 + maxW) {
      cursorX = 85;
      cursorY += 96;
    }

    const isCurrent = i === activeIdx;
    const isPast = i < activeIdx;

    if (isCurrent) {
      // Pop-up Yellow Highlighter Box
      ctx.save();
      ctx.translate(cursorX + wWidth / 2, cursorY - 22);
      ctx.scale(1.08, 1.08);
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-wWidth / 2, -44, wWidth, 76);
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.fillText(word, 0, 14);
      ctx.restore();
    } else {
      ctx.fillStyle = isPast ? "#18181b" : "rgba(24, 24, 27, 0.45)";
      ctx.fillText(word, cursorX + 10, cursorY - 8);
    }

    cursorX += wWidth + 10;
  });
}

// Film Grain + Bottom Progress Bar
function renderOverlays(t) {
  // Film Grain
  ctx.drawImage(grainCanvas, 0, 0, 1080, 1920);

  // Subtle Vignette
  const vig = ctx.createRadialGradient(540, 960, 500, 540, 960, 1150);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.28)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, 1080, 1920);

  // Bottom Timeline Bar
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(80, 1815, 920, 14);
  ctx.fillStyle = "#dc2626";
  ctx.fillRect(80, 1815, 920 * Math.min(t / DURATION, 1), 14);
}

function drawFrame(t) {
  if (Math.floor(t * 15) % 2 === 0) refreshGrain();
  applyCameraAndBackground(t);

  if (t < 7) renderScene1(t);
  else if (t < 15) renderScene2(t - 7);
  else if (t < 23) renderScene3(t - 15);
  else renderScene4(t - 23);

  renderKineticSubtitles(t);
  renderOverlays(t);
  ctx.restore();
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (isPlaying) return;
  isPlaying = true;
  startTime = performance.now();
  statusEl.textContent = "▶ Vox Pro Preview ஓடுகிறது (30s)...";

  function loop(now) {
    const elapsed = (now - startTime) / 1000;
    if (elapsed >= DURATION) {
      drawFrame(DURATION - 0.01);
      isPlaying = false;
      statusEl.textContent = "✅ Preview முடிந்தது! Export அழுத்தவும்.";
      return;
    }
    drawFrame(elapsed);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});
